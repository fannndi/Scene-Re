## Project-wide Gradle settings.
# For more details see https://docs.gradle.org/current/userguide/build_environment.html

# --- JVM ---------------------------------------------------------------------
# --add-opens=java.base/java.io is required by AGP. MaxMetaspaceSize is set
# explicitly so long-lived daemons do not grow without bound.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 --add-opens=java.base/java.io=ALL-UNNAMED

# --- Build performance --------------------------------------------------------
# `org.gradle.parallel` and `org.gradle.caching` are still OFF on this machine:
# with them enabled builds repeatedly failed with
#   FileNotFoundException: ~/.gradle/caches/<ver>/transforms/.internal/locks/*.lock (Access is denied)
# on tasks such as :app:compileDebugKotlin and :app:dataBindingGenBaseClassesDebug.
# The lock files were 0 bytes and not held by any process, which points at
# antivirus / indexer interference with the very high file churn those two
# features create. Re-enable them after excluding the Gradle user home from
# real-time scanning, then verify with a clean build.
org.gradle.parallel=false

# The configuration cache is safe to enable: the only configuration-time
# external process (`git rev-list HEAD --count` for versionCode) was converted
# to a ValueSource in app/build.gradle, which Gradle is able to cache. This
# skips the whole configuration phase on every subsequent build.
org.gradle.configuration-cache=true
# Do not re-run configuration when a task from the cache fails — surface the
# original failure instead of silently retrying with a fresh configuration.
org.gradle.configuration-cache.problems=warn

# --- Android ------------------------------------------------------------------
android.useAndroidX=true
# Must stay `false`. The app module references library and appcompat resources
# from Kotlin code, which only resolves through transitive R classes:
#   app/src/main/java/com/omarea/vtools/activities/ActionPage.kt           R.drawable.kr_folder, R.drawable.kr_fab  (:krscript)
#   app/src/main/java/com/omarea/vtools/activities/ActionPageOnline.kt     R.string.kr_download_downloading/_completed (:krscript)
#   app/src/main/java/com/omarea/vtools/dialogs/DialogAppOptions.kt        R.layout.dialog_loading, R.id.dialog_text,
#                                                                         R.id.dialog_app_details_progress (:common)
# Setting this to `true` fails the build with UNRESOLVED_REFERENCE. To migrate,
# qualify each of the references above with the owning R class first.
# (The two R.attr.colorAccent references that used to be listed here were
# removed: TabIconHelper2.getColorAccent() now resolves MaterialColors, and the
# chart views use android.R.attr.colorAccent, which is a platform attribute.)
android.nonTransitiveRClass=false
android.javaCompile.suppressSourceTargetDeprecationWarning=true
