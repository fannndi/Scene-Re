# Configuration for the script engine.
# Lines starting with "#" are comments.
# Parameter lines use the form PARAM_NAME="value" - this format is mandatory.
# Do not remove parameters that are not marked optional; the engine will break.
#
# The parser for this file is simplistic: never put a comment after a parameter
# line.
# Wrong:
#           param_name="value" # explanation
# Right:
#           # explanation
#           param_name="value"


# core_executor - the entry point kr-script uses to run shell scripts
executor_core="file:///android_asset/kr-script/executor.sh"

# Page-list configuration file (may be left empty)
page_list_config="file:///android_asset/kr-script/more.xml"

# Toolkit directory (busybox and friends)
toolkit_dir="file:///android_asset/toolkit"
