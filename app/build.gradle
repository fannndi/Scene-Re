def generateVersionCode() {
    try {
        def result = "git rev-list HEAD --count".execute().text.trim() //unix
        if (result.empty) result = "PowerShell -Command git rev-list HEAD --count".execute().text.trim() //windows
        if (!result.empty && result.isInteger()) {
            return result.toInteger()
        }
    } catch (Exception ignored) {
        // git 不可用（例如浅克隆环境）时走下面的兜底逻辑
    }
    logger.warn("Could not generate versionCode from git history, fallback to 1")
    return 1
}
