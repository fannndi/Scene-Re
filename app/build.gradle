apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
def hasSigningConfig = keystorePropsFile.exists()
if (hasSigningConfig) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
} else {
    logger.warn("keystore.properties not found: release variants will be unsigned, debug builds still work")
}

def buildVersionCode = generateVersionCode()

android {
    namespace "com.omarea.vtools"
    buildFeatures {
        dataBinding true
        viewBinding true
        aidl true
        compose true
    }
    signingConfigs {
        if (hasSigningConfig) {
            omarea_Signing {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    compileSdk 36
    defaultConfig {
        resConfigs "en"
        applicationId "com.omarea.vtools"
        minSdk 24
        targetSdk 34
        versionCode buildVersionCode
        versionName "r" + buildVersionCode
        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
        ndk {
            // abiFilters "armeabi", "armeabi-v7a", "arm64-v8a", "x86", "x86_64", "mips", "mips64"
            abiFilters "arm64-v8a"
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            zipAlignEnabled true
            debuggable false
            jniDebuggable = false
            if (hasSigningConfig) {
                signingConfig signingConfigs.omarea_Signing
            }
        }
        release_mini {
            shrinkResources true
            zipAlignEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            minifyEnabled true
            debuggable false
            jniDebuggable = false
            if (hasSigningConfig) {
                signingConfig signingConfigs.omarea_Signing
            }
        }
        debug {
            // signingConfig signingConfigs.omarea_Signing
            minifyEnabled false
            debuggable true
            jniDebuggable = false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    productFlavors {
    }
    /*
    android.applicationVariants.all { variant ->
        variant.outputs.all {
            variant.getPackageApplication().outputDirectory = new File(project.rootDir.absolutePath + "/build/outputs/apk/release")
            outputFileName = "${project.name}_${defaultConfig.versionName}_${variant.buildType.name}.apk"
        }
    }
    */
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
    ndkVersion '28.2.13676358'
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def versionCode = output.versionCode.get()
            def fileName = "Scene" + "_5.0_OpenSource_r${versionCode}_" + variant.name + ".apk"
            output.outputFileName.set(fileName)
        }
    }
}

