apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
} else {
    throw new GradleException("Missing keystore.properties in project root (copy keystore.properties.example and fill in real values)")
}

// Resolved once and reused for both versionCode and versionName.
def gitVersionCode = generateVersionCode()

android {
    namespace = "com.omarea.vtools"

    buildFeatures {
        dataBinding = true
        viewBinding = true
        compose = true
    }

    signingConfigs {
        omarea_Signing {
            storeFile = rootProject.file(keystoreProps['storeFile'])
            storePassword = keystoreProps['storePassword']
            keyAlias = keystoreProps['keyAlias']
            keyPassword = keystoreProps['keyPassword']
        }
    }

    compileSdk = libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        applicationId = "com.omarea.vtools"
        minSdk = libs.versions.minSdk.get().toInteger()
        targetSdk = libs.versions.targetSdk.get().toInteger()
        versionCode = gitVersionCode
        versionName = "r" + gitVersionCode

        ndk {
            // Qualcomm Snapdragon devices only; 64-bit is the only ABI worth shipping.
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }

    // Replaces the deprecated `resConfigs "en"`.
    androidResources {
        localeFilters = ["en"]
    }

    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            zipAlignEnabled = true
            debuggable = false
            jniDebuggable = false
            signingConfig = signingConfigs.omarea_Signing
        }
        release_mini {
            shrinkResources = true
            zipAlignEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            minifyEnabled = true
            debuggable = false
            jniDebuggable = false
        }
        debug {
            minifyEnabled = false
            debuggable = true
            jniDebuggable = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path = "src/main/cpp/CMakeLists.txt"
            version = libs.versions.cmake.get()
        }
    }

    ndkVersion = libs.versions.ndk.get()
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def versionCode = output.versionCode.get()
            output.outputFileName.set("Scene_5.0_OpenSource_r${versionCode}_${variant.name}.apk")
        }
    }
}

dependencies {
    implementation platform(libs.composeBom)
    implementation libs.composeUi
    implementation libs.composeUiToolingPreview
    implementation libs.composeFoundation
    implementation libs.composeMaterial3
    debugImplementation libs.composeUiTooling

    implementation libs.miuix
    implementation libs.kotlinxCoroutinesAndroid
    implementation libs.kotlinStdlib

    implementation libs.androidxAppcompat
    implementation libs.androidxConstraintlayout
    implementation libs.androidxViewpager2
    implementation libs.androidxWorkRuntimeKtx
    implementation libs.googleMaterial

    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation project(':common')
    implementation project(':krscript')

    debugImplementation libs.leakcanaryAndroid
}

/**
 * Derives the versionCode from the number of git commits.
 * Runs git in the project directory so the result does not depend on the
 * working directory of the Gradle daemon.
 */
def generateVersionCode() {
    def result = "git rev-list HEAD --count".execute(null, rootProject.projectDir).text.trim()
    if (result.empty) {
        throw new GradleException("Could not generate versionCode: `git rev-list HEAD --count` produced no output. Is this a git checkout with at least one commit?")
    }
    return result.toInteger()
}
