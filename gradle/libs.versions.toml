# Gradle Version Catalog — single source of truth for all dependency versions.
# Docs: https://docs.gradle.org/current/userguide/version_catalogs.html
#
# Consumers use accessors such as `libs.androidx.appcompat` or
# `libs.versions.agp.get()`. Never hardcode a version in a build script.

[versions]
# --- Toolchain -------------------------------------------------------------
# AGP 9.4.x requires Gradle >= 9.6.0 (see gradle/wrapper/gradle-wrapper.properties)
# and supports up to API level 37. Minimum JDK is 17.
agp = "9.4.1"
# Keep `kotlin` in lockstep with the Compose compiler plugin, which is
# published under the same version as the Kotlin compiler.
kotlin = "2.4.20"

# --- SDK / NDK levels ------------------------------------------------------
# This app targets Xiaomi/Snapdragon devices running Android 10 through 13.
# minSdk 29 is the install floor. targetSdk 33 fixes the runtime behaviour
# contract at Android 13, which is the newest ROM family the app is tested on.
#
# compileSdk is a build-time-only knob: it chooses which platform stubs the
# code compiles against and does NOT affect which devices can install the app
# (that is minSdk alone). It is pinned to the minimum the dependency set needs:
#   Compose 1.12 (BOM 2026.09.00)   -> minCompileSdk=37
#   appcompat 1.8.0                 -> minCompileSdk=35
#   core-ktx 1.19.1                 -> minCompileSdk=36
#   material 1.14.0                 -> minCompileSdk=35
#   work-runtime 2.12.0             -> minCompileSdk=35
# 37 is the newest platform level AGP 9.4 supports, and platform 37 is what the
# whole set now asks for. `:app:checkDebugAarMetadata` enforces this at build
# time.
compileSdk = "37"
targetSdk = "33"
minSdk = "29"
# NDK 30.0.16248370 is the current stable line (AGP's default 28.2 is the LTS
# baseline). Both carry the 16 KB page-size support targetSdk 33 does not yet
# require.
ndk = "30.0.16248370"
cmake = "3.22.1"

# --- Libraries -------------------------------------------------------------
# Latest stable BOM. From Compose 1.12 this line requires compileSdk 37, which
# is why compileSdk moved to 37 above.
composeBom = "2026.09.00"
appcompat = "1.8.0"
coreKtx = "1.19.1"
# material 1.14.0 is the current stable Material Components release.
material = "1.14.0"
constraintlayout = "2.2.2"
viewpager2 = "1.1.0"
work = "2.12.0"
coroutines = "1.11.0"
leakcanary = "2.14"

# --- Test ------------------------------------------------------------------
# The androidx.test 1.7.x line / espresso 3.7.x are the current stable
# releases. They are androidTest-only, so their own API floor never affects the
# shipped APK's minSdk 29.
junit = "4.13.2"
androidxTestCore = "1.7.0"
androidxTestRunner = "1.7.0"
androidxTestRules = "1.7.0"
androidxTestMonitor = "1.8.0"
androidxTestExtJunit = "1.3.0"
androidxTestEspresso = "3.7.0"

[libraries]
# Compose — versions are supplied by the BOM, so no version.ref is declared.
composeBom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
composeUi = { module = "androidx.compose.ui:ui" }
composeUiTooling = { module = "androidx.compose.ui:ui-tooling" }
composeUiToolingPreview = { module = "androidx.compose.ui:ui-tooling-preview" }
composeFoundation = { module = "androidx.compose.foundation:foundation" }
composeMaterial3 = { module = "androidx.compose.material3:material3" }

androidxAppcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidxCoreKtx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidxConstraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidxViewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "viewpager2" }
androidxWorkRuntimeKtx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

googleMaterial = { module = "com.google.android.material:material", version.ref = "material" }

kotlinStdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlinxCoroutinesAndroid = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

leakcanaryAndroid = { module = "com.squareup.leakcanary:leakcanary-android", version.ref = "leakcanary" }

# Test — JVM (src/test). Deliberately no Robolectric: the logic under test is
# pure Kotlin, and Robolectric would drag in a large SDK-jar download for no gain.
junit = { module = "junit:junit", version.ref = "junit" }

# Test — instrumented (src/androidTest).
androidxTestCore = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidxTestCoreKtx = { module = "androidx.test:core-ktx", version.ref = "androidxTestCore" }
androidxTestRunner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidxTestRules = { module = "androidx.test:rules", version.ref = "androidxTestRules" }
androidxTestMonitor = { module = "androidx.test:monitor", version.ref = "androidxTestMonitor" }
androidxTestExtJunit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidxTestEspresso = { module = "androidx.test.espresso:espresso-core", version.ref = "androidxTestEspresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
