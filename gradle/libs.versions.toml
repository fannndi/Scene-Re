# Gradle Version Catalog — single source of truth for all dependency versions.
# Docs: https://docs.gradle.org/current/userguide/version_catalogs.html
#
# Consumers use accessors such as `libs.androidx.appcompat` or
# `libs.versions.agp.get()`. Never hardcode a version in a build script.

[versions]
# --- Toolchain -------------------------------------------------------------
# AGP 9.4.x requires Gradle >= 9.6.0 (see gradle/wrapper/gradle-wrapper.properties)
# and supports up to API level 37. Minimum JDK is 17.
agp = "9.4.1"
# Keep `kotlin` in lockstep with the Compose compiler plugin, which is
# published under the same version as the Kotlin compiler.
kotlin = "2.4.20"

# --- SDK / NDK levels ------------------------------------------------------
# This app targets Xiaomi/Snapdragon devices running Android 10 through 13.
# minSdk 29 is the install floor. targetSdk 33 fixes the runtime behaviour
# contract at Android 13, which is the newest ROM family the app is tested on.
#
# compileSdk is a build-time-only knob: it chooses which platform stubs the
# code compiles against and does NOT affect which devices can install the app
# (that is minSdk alone). It is pinned to 34 because that is the floor the
# dependency set below declares in its AAR metadata:
#   Compose 1.7.6 (BOM 2024.12.01)  -> minCompileSdk=34
#   appcompat 1.7.1                 -> minCompileSdk=34
#   constraintlayout 2.2.2          -> minCompileSdk=34
#   viewpager2 1.1.0                -> minCompileSdk=34
#   work-runtime 2.9.1              -> minCompileSdk=34
#   core-ktx 1.13.1                 -> minCompileSdk=34
# Raising compileSdk above 34 would swap in newer platform stubs and can change
# nullability verdicts in untouched code, so it is kept at the true minimum.
# `:app:checkDebugAarMetadata` enforces all of the above at build time.
compileSdk = "34"
targetSdk = "33"
minSdk = "29"
# NDK 28.2.13676358 is the default for AGP 9.4 and is the first LTS line with
# 16 KB page-size support. Kept current even though targetSdk 33 predates the
# requirement, so a future targetSdk bump does not need an NDK change.
ndk = "28.2.13676358"
cmake = "3.22.1"

# --- Libraries -------------------------------------------------------------
# Highest Compose BOM whose artifacts still declare minCompileSdk=34, i.e. the
# newest release that keeps compileSdk at 34. BOM 2024.12.01 maps to Compose
# 1.7.6 / Material3 1.3.1; every later BOM (2025.01.00 onward) needs 35 or 37.
composeBom = "2024.12.01"
# appcompat 1.8.0 requires minCompileSdk=35. 1.7.1 is the newest release at 34
# and only requests core-ktx 1.13.0 (also 34). material 1.14.0 only asks for
# appcompat 1.7.0, so it does not pull this back up.
appcompat = "1.7.1"
# core-ktx is declared explicitly so AGP 9's `-ktx` artifact mirroring (which
# synthesises an unversioned request for `core-ktx` to keep it in lockstep with
# `core`) resolves to a pinned version instead of whatever is newest in the
# local Gradle cache. 1.13.1 is the newest core-ktx with minCompileSdk=34
# (1.15.0 raised it to 35).
coreKtx = "1.13.1"
# material 1.14.0 hard-requires androidx.core:core:1.16.0 (minCompileSdk=35) and
# would drag compileSdk up with it. 1.13.0 is minCompileSdk=1 and only asks for
# core:1.6.0, so it is the newest Material Components release compatible with
# the compileSdk 34 ceiling. The only 1.14.0 feature the app used was the
# MaterialToolbar/subtitle helpers, which are available from 1.9.0 onward.
material = "1.13.0"
constraintlayout = "2.2.2"
viewpager2 = "1.1.0"
# 2.9.1 is the newest work-runtime with minCompileSdk=34; 2.10.0 raised it to 35.
work = "2.9.1"
coroutines = "1.11.0"
leakcanary = "2.14"

[libraries]
# Compose — versions are supplied by the BOM, so no version.ref is declared.
composeBom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
composeUi = { module = "androidx.compose.ui:ui" }
composeUiTooling = { module = "androidx.compose.ui:ui-tooling" }
composeUiToolingPreview = { module = "androidx.compose.ui:ui-tooling-preview" }
composeFoundation = { module = "androidx.compose.foundation:foundation" }
composeMaterial3 = { module = "androidx.compose.material3:material3" }

androidxAppcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidxCoreKtx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidxConstraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidxViewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "viewpager2" }
androidxWorkRuntimeKtx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

googleMaterial = { module = "com.google.android.material:material", version.ref = "material" }

kotlinStdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlinxCoroutinesAndroid = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

leakcanaryAndroid = { module = "com.squareup.leakcanary:leakcanary-android", version.ref = "leakcanary" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
