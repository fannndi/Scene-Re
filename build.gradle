// Top-level build file. Plugin versions come from gradle/libs.versions.toml.
// `apply false` puts each plugin on the buildscript classpath without applying
// it to the root project, so the module scripts can still use
// `apply plugin: '...'`.
plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.android.library) apply false
    alias(libs.plugins.kotlin.compose) apply false
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
