apply plugin: 'com.android.library'

android {
    namespace = "com.omarea.krscript"
    compileSdk = libs.versions.compileSdk.get().toInteger()

    buildFeatures {
        viewBinding = true
    }

    defaultConfig {
        minSdk = libs.versions.minSdk.get().toInteger()
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release_mini {
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // `api`: this module's public API exposes :common types (dialogs, theme
    // helpers) and AppCompat types, so consumers need both on their compile
    // classpath rather than having to redeclare them.
    api project(':common')
    api libs.androidxAppcompat
    implementation libs.kotlinStdlib
}
